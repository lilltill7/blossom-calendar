<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blossom Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. THEME — change these values to restyle everything
   ========================================================= */
:root{
  --bg:#fff6f9;          /* page background */
  --paper:#ffffff;       /* cards + drawer */
  --blush:#ffdbe8;       /* soft pink for bubbles */
  --pink:#ff8fb8;        /* main pink */
  --hot:#ff5c9a;         /* strong accent pink */
  --ink:#6b2447;         /* text */
  --soft-ink:#b0718f;    /* quieter text */
  --glow:rgba(255,120,170,.28);
  --center:#ffe38a;      /* flower centers */
  --radius-big:32px;
  --radius-cell:22px;
  --font-display:"Sniglet","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Quicksand","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2b1320; --paper:#3b1b2d; --blush:#5c2842; --pink:#ff8fb8; --hot:#ff7aab;
    --ink:#ffe3ee; --soft-ink:#e3a3c0; --glow:rgba(255,120,170,.18); --center:#ffd86b;
  }
}
:root[data-theme="dark"]{
  --bg:#2b1320; --paper:#3b1b2d; --blush:#5c2842; --pink:#ff8fb8; --hot:#ff7aab;
  --ink:#ffe3ee; --soft-ink:#e3a3c0; --glow:rgba(255,120,170,.18); --center:#ffd86b;
}

/* =========================================================
   2. BASE
   ========================================================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%;
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-weight:600;
  overflow-x:hidden;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--hot); outline-offset:3px; }

/* shared glossy "bubble" surface */
.gloss{
  background:linear-gradient(160deg,var(--paper) 0%,var(--blush) 100%);
  box-shadow:
    inset 0 -6px 10px rgba(255,120,170,.22),
    inset 0 2px 3px rgba(255,255,255,.9),
    0 5px 14px var(--glow);
  position:relative;
}
.gloss::before{
  content:""; position:absolute; top:6px; left:10%; width:38%; height:16px;
  border-radius:50%; transform:rotate(-6deg); pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.9),rgba(255,255,255,0));
}

/* =========================================================
   3. LAYOUT + HEADER
   ========================================================= */
.app{ max-width:1240px; margin:0 auto; padding:32px 20px 64px; position:relative; }

header{ display:flex; align-items:center; flex-wrap:wrap; gap:14px 16px; margin-bottom:22px; position:relative; z-index:1; }
.title-wrap{ flex:1; min-width:220px; display:flex; align-items:center; gap:14px; }
.month-title{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(2.2rem,6vw,3.6rem); line-height:1; margin:0;
  color:var(--hot);
  text-shadow:0 3px 0 var(--paper), 0 8px 18px var(--glow);
}
.year{ color:var(--soft-ink); font-weight:700; display:block; margin-top:6px; }

.controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.bubble-btn{
  border:none; cursor:pointer; border-radius:999px;
  background:linear-gradient(160deg,var(--paper),var(--blush));
  box-shadow:inset 0 -4px 7px rgba(255,120,170,.25), inset 0 2px 3px rgba(255,255,255,.9), 0 4px 10px var(--glow);
  color:var(--hot);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);
}
.bubble-btn:hover{ transform:scale(1.06); }
.bubble-btn:active{ transform:scale(.94); }
.nav-btn{ width:48px; height:48px; font-size:1.5rem; font-weight:700; display:grid; place-items:center; }
.today-btn{ padding:12px 18px; font-weight:700; }

/* Month / Week tabs */
.tabs{
  display:flex; padding:5px; border-radius:999px; background:var(--paper);
  box-shadow:inset 0 2px 6px var(--glow);
}
.tab{
  border:none; background:none; cursor:pointer; padding:10px 20px; border-radius:999px;
  font-weight:700; color:var(--soft-ink); transition:background .2s, color .2s;
}
.tab[aria-selected="true"]{
  background:linear-gradient(160deg,var(--pink),var(--hot)); color:#fff;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.45), 0 4px 10px var(--glow);
}

/* =========================================================
   4. CARD
   ========================================================= */
.card{
  background:var(--paper); border-radius:var(--radius-big);
  padding:20px 16px 22px; position:relative; z-index:1;
  box-shadow:0 18px 44px var(--glow);
}
.weekdays{
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; text-align:center;
  color:var(--soft-ink); font-size:.9rem; font-weight:700; margin-bottom:10px;
}

/* =========================================================
   5. MONTH VIEW — big jelly tiles with tasks showing
   ========================================================= */
.grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; touch-action:pan-y; }

.day{
  border:none; cursor:pointer; text-align:left;
  border-radius:var(--radius-cell);
  min-height:clamp(70px,10vw,132px);
  padding:8px 8px 10px;
  display:flex; flex-direction:column; gap:4px;
  font-weight:600; color:var(--ink);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
}
.day:hover{ transform:translateY(-2px) scale(1.02); }
.day.other{ opacity:.4; }
.day.selected{ box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--hot), 0 6px 14px var(--glow); }

.num{
  width:30px; height:30px; border-radius:50%; flex:none;
  display:grid; place-items:center; font-weight:700; font-size:.95rem;
  position:relative; z-index:1;
}
.day.today .num, .wk-day.today .wk-num{
  background:linear-gradient(160deg,var(--pink),var(--hot)); color:#fff;
  box-shadow:0 3px 8px var(--glow);
}
.day.today{ box-shadow:0 0 0 3px var(--pink), 0 5px 14px var(--glow); }

.chip{
  display:block; width:100%; border-radius:999px;
  padding:3px 8px 3px 7px; font-size:.78rem; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:color-mix(in srgb, var(--c) 24%, var(--paper));
  border-left:5px solid var(--c);
}
.chip.done{ text-decoration:line-through; opacity:.55; }
.more{ font-size:.75rem; color:var(--soft-ink); padding-left:6px; }

/* on small phones the text won't fit, so chips become color bars */
@media (max-width:620px){
  .grid, .weekdays{ gap:5px; }
  .day{ padding:5px; border-radius:16px; }
  .num{ width:24px; height:24px; font-size:.8rem; }
  .chip{ font-size:0; height:6px; padding:0; border-left:none; background:var(--c); }
  .more{ font-size:.65rem; padding:0; }
}

/* =========================================================
   6. WEEK VIEW — every day's full list, side by side
   ========================================================= */
.week{
  display:grid; grid-auto-flow:column;
  grid-auto-columns:minmax(200px,1fr);
  gap:14px; overflow-x:auto; padding:8px 4px 14px;
  scroll-snap-type:x mandatory;
}
@media (max-width:620px){ .week{ grid-auto-columns:82%; } }

.wk-day{
  border-radius:28px; padding:16px 14px 14px;
  min-height:clamp(380px,58vh,560px);
  display:flex; flex-direction:column; gap:12px;
  scroll-snap-align:start;
}
.wk-day.today{ box-shadow:0 0 0 3px var(--pink), 0 8px 20px var(--glow); }
.wk-head{ display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
.wk-num{
  width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-family:var(--font-display); font-weight:800; font-size:1.4rem; color:var(--hot);
  background:var(--paper); box-shadow:inset 0 -3px 6px var(--glow);
}
.wk-name{ font-weight:700; font-size:1.05rem; }
.wk-count{ font-size:.8rem; color:var(--soft-ink); }

.wk-list{ list-style:none; margin:0; padding:0; flex:1; display:flex; flex-direction:column; gap:8px; }
.wk-empty{ color:var(--soft-ink); font-size:.9rem; padding:6px 4px; }
.wk-add{ padding:10px; font-weight:700; width:100%; }

/* =========================================================
   7. TASK ROWS (shared by week view + drawer)
   ========================================================= */
.task{
  display:flex; align-items:center; gap:10px;
  padding:10px 10px 10px 12px; border-radius:20px;
  background:color-mix(in srgb, var(--c) 18%, var(--paper));
  animation:pop .3s cubic-bezier(.3,1.6,.5,1);
}
@keyframes pop{ from{ transform:scale(.88); opacity:0; } }
.check{
  flex:none; width:26px; height:26px; border-radius:50%; cursor:pointer;
  border:3px solid var(--c); background:transparent; position:relative;
}
.task.done .check{ background:var(--c); }
.task.done .check::after{
  content:""; position:absolute; left:6px; top:2px; width:6px; height:12px;
  border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg);
}
.task-text{ flex:1; overflow-wrap:anywhere; font-size:.95rem; }
.task.done .task-text{ text-decoration:line-through; opacity:.55; }
.del{
  flex:none; border:none; background:none; cursor:pointer; color:var(--soft-ink);
  width:30px; height:30px; border-radius:50%; font-size:1.15rem;
}
.del:hover{ background:var(--blush); }

/* =========================================================
   8. FLOWERS (decor)
   ========================================================= */
.flower{ position:absolute; pointer-events:none; color:var(--pink); }
.f1{ width:140px; top:-26px; right:-40px; z-index:0; color:var(--blush); transform:rotate(12deg); }
.f3{ width:100px; bottom:-34px; left:-34px; z-index:2; color:var(--pink); transform:rotate(20deg); }
.f4{ width:44px; bottom:30px; left:52px; z-index:2; color:var(--blush); }
.header-flower{ width:48px; flex:none; color:var(--pink); animation:spin 14s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.from-right{ animation:inRight .38s cubic-bezier(.2,1,.4,1); }
.from-left{ animation:inLeft .38s cubic-bezier(.2,1,.4,1); }
@keyframes inRight{ from{ transform:translateX(50px); opacity:0; } }
@keyframes inLeft{ from{ transform:translateX(-50px); opacity:0; } }

/* =========================================================
   9. ADD/EDIT DRAWER
   ========================================================= */
.scrim{
  position:fixed; inset:0; background:rgba(107,36,71,.18); z-index:9;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.scrim.show{ opacity:1; pointer-events:auto; }

.drawer{
  position:fixed; top:0; right:0; z-index:10;
  height:100%; width:min(420px,100%);
  background:var(--paper);
  border-radius:var(--radius-big) 0 0 var(--radius-big);
  box-shadow:-12px 0 44px var(--glow);
  padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; overflow-y:auto;
  transform:translateX(105%);
  transition:transform .45s cubic-bezier(.2,1.15,.4,1);
  visibility:hidden;
}
.drawer.open{ transform:none; visibility:visible; }
@media (max-width:640px){
  .drawer{
    top:auto; bottom:0; width:100%; height:80%;
    border-radius:var(--radius-big) var(--radius-big) 0 0;
    transform:translateY(105%);
  }
}
.drawer-head{ display:flex; align-items:flex-start; gap:12px; margin-bottom:18px; }
.drawer-head div{ flex:1; }
.weekday-name{ color:var(--soft-ink); font-weight:700; margin:0 0 2px; }
.date-name{ font-family:var(--font-display); font-weight:800; font-size:2rem; line-height:1.05; color:var(--hot); margin:0; }
.close-btn{ width:42px; height:42px; font-size:1.3rem; display:grid; place-items:center; }
.tasks{ list-style:none; margin:0 0 16px; padding:0; flex:1; display:flex; flex-direction:column; gap:10px; }
.empty{ color:var(--soft-ink); text-align:center; padding:28px 10px; }
.empty svg{ width:56px; color:var(--blush); display:block; margin:0 auto 10px; }

.add-form{ display:flex; flex-direction:column; gap:12px; }
.add-row{ display:flex; gap:8px; }
.task-input{
  flex:1; min-width:0; border:none; border-radius:999px; padding:14px 18px;
  font:inherit; color:var(--ink); background:var(--bg);
  box-shadow:inset 0 2px 6px var(--glow);
}
.task-input::placeholder{ color:var(--soft-ink); }
.add-btn{ padding:0 20px; font-weight:700; background:linear-gradient(160deg,var(--pink),var(--hot)); color:#fff; }

.swatches{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.swatch{
  width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
  background:var(--c); position:relative;
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.15), inset 0 2px 2px rgba(255,255,255,.6);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);
}
.swatch::before{
  content:""; position:absolute; top:14%; left:22%; width:36%; height:22%; border-radius:50%;
  background:rgba(255,255,255,.75); transform:rotate(-22deg);
}
.swatch[aria-pressed="true"]{ transform:scale(1.15); box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--c); }
.custom-color{
  width:32px; height:32px; border-radius:50%; border:2px dashed var(--soft-ink);
  padding:0; overflow:hidden; cursor:pointer; background:none;
}
.custom-color::-webkit-color-swatch-wrapper{ padding:0; }
.custom-color::-webkit-color-swatch{ border:none; border-radius:50%; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
}
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[hidden]{ display:none !important; }
</style>
</head>
<body>

<!-- Reusable flower shape. Change the petals here and every flower updates. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 100 100">
    <g fill="currentColor">
      <ellipse cx="50" cy="25" rx="16" ry="22"/>
      <ellipse cx="50" cy="25" rx="16" ry="22" transform="rotate(72 50 50)"/>
      <ellipse cx="50" cy="25" rx="16" ry="22" transform="rotate(144 50 50)"/>
      <ellipse cx="50" cy="25" rx="16" ry="22" transform="rotate(216 50 50)"/>
      <ellipse cx="50" cy="25" rx="16" ry="22" transform="rotate(288 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="13" fill="var(--center)"/>
    <circle cx="46" cy="46" r="4" fill="#fff" opacity=".7"/>
  </symbol>
</svg>

<main class="app">
  <svg class="flower f1" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>

  <header>
    <div class="title-wrap">
      <svg class="header-flower" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>
      <div>
        <h1 class="month-title" id="title">September</h1>
        <span class="year" id="subtitle">2026</span>
      </div>
    </div>
    <div class="controls">
      <div class="tabs" role="tablist" aria-label="Calendar view">
        <button class="tab" role="tab" id="tabMonth" aria-selected="true">Month</button>
        <button class="tab" role="tab" id="tabWeek" aria-selected="false">Week</button>
      </div>
      <button class="bubble-btn today-btn" id="todayBtn">Today</button>
      <button class="bubble-btn nav-btn" id="prevBtn" aria-label="Previous">‹</button>
      <button class="bubble-btn nav-btn" id="nextBtn" aria-label="Next">›</button>
    </div>
  </header>

  <section class="card" aria-label="Calendar">
    <div id="monthView">
      <div class="weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="weekView" hidden>
      <div class="week" id="week"></div>
    </div>
  </section>
  <svg class="flower f3" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>
  <svg class="flower f4" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>
</main>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-labelledby="dateName" role="dialog">
  <div class="drawer-head">
    <div>
      <p class="weekday-name" id="weekdayName">Thursday</p>
      <h2 class="date-name" id="dateName">September 24</h2>
    </div>
    <button class="bubble-btn close-btn" id="closeBtn" aria-label="Close">×</button>
  </div>
  <ul class="tasks" id="taskList"></ul>
  <form class="add-form" id="addForm">
    <div class="add-row">
      <label class="sr-only" for="taskInput">New task</label>
      <input class="task-input" id="taskInput" placeholder="Add a task or event" autocomplete="off">
      <button class="bubble-btn add-btn" type="submit">Add</button>
    </div>
    <div class="swatches" id="swatches" role="group" aria-label="Task color"></div>
  </form>
</aside>

<script>
/* =========================================================
   10. SETTINGS — your task colors live here
   ========================================================= */
const COLORS = [
  { name: "Strawberry", hex: "#ff5c8a" },
  { name: "Peach",      hex: "#ffa36c" },
  { name: "Butter",     hex: "#f2c14e" },
  { name: "Mint",       hex: "#4cc9a0" },
  { name: "Sky",        hex: "#5aa9f0" },
  { name: "Lavender",   hex: "#a57cf0" },
];
const MAX_CHIPS = 3;   // how many tasks show inside a month tile before "+ more"
const STORAGE_KEY = "blossom-tasks-v1";
const VIEW_KEY = "blossom-view-v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* =========================================================
   11. STATE
   tasks looks like: { "2026-09-24": [ {id, text, color, done} ] }
   ========================================================= */
let tasks = load(STORAGE_KEY, {});
let mode = load(VIEW_KEY, "month");        // "month" or "week"
let monthStart = firstOfMonth(new Date());
let weekStart = startOfWeek(new Date());
let selected = null;                       // Date whose drawer is open
let chosenColor = COLORS[0].hex;

const $ = id => document.getElementById(id);
const grid = $("grid"), weekEl = $("week"), drawer = $("drawer"), scrim = $("scrim");

function load(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function store(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
const save = () => store(STORAGE_KEY, tasks);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sameDay = (a, b) => a && b && keyOf(a) === keyOf(b);
function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfWeek(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
const short = d => MONTHS[d.getMonth()].slice(0, 3);

function animate(el, dir){
  if (!dir) return;
  el.classList.remove("from-left", "from-right");
  void el.offsetWidth;
  el.classList.add(dir > 0 ? "from-right" : "from-left");
}

/* =========================================================
   12. RENDER
   ========================================================= */
function render(dir){
  const isMonth = mode === "month";
  $("monthView").hidden = !isMonth;
  $("weekView").hidden = isMonth;
  $("tabMonth").setAttribute("aria-selected", isMonth);
  $("tabWeek").setAttribute("aria-selected", !isMonth);
  $("prevBtn").setAttribute("aria-label", isMonth ? "Previous month" : "Previous week");
  $("nextBtn").setAttribute("aria-label", isMonth ? "Next month" : "Next week");
  isMonth ? renderMonth(dir) : renderWeek(dir);
}

function renderMonth(dir){
  const y = monthStart.getFullYear(), m = monthStart.getMonth();
  $("title").textContent = MONTHS[m];
  $("subtitle").textContent = y;

  grid.innerHTML = "";
  const today = new Date();
  const first = addDays(monthStart, -monthStart.getDay());

  for (let i = 0; i < 42; i++){
    const d = addDays(first, i);
    const list = tasks[keyOf(d)] || [];

    const cell = document.createElement("button");
    cell.className = "day gloss";
    if (d.getMonth() !== m) cell.classList.add("other");
    if (sameDay(d, today)) cell.classList.add("today");
    if (sameDay(d, selected)) cell.classList.add("selected");
    cell.setAttribute("aria-label",
      `${MONTHS[d.getMonth()]} ${d.getDate()}` + (list.length ? `: ${list.map(t => t.text).join(", ")}` : ""));

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = d.getDate();
    cell.appendChild(num);

    list.slice(0, MAX_CHIPS).forEach(t => {
      const chip = document.createElement("span");
      chip.className = "chip" + (t.done ? " done" : "");
      chip.style.setProperty("--c", t.color);
      chip.textContent = t.text;
      cell.appendChild(chip);
    });
    if (list.length > MAX_CHIPS){
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = `+${list.length - MAX_CHIPS} more`;
      cell.appendChild(more);
    }

    cell.addEventListener("click", () => openDay(d));
    grid.appendChild(cell);
  }
  animate(grid, dir);
}

function renderWeek(dir){
  const end = addDays(weekStart, 6);
  $("title").textContent = `${short(weekStart)} ${weekStart.getDate()} – ${
    end.getMonth() === weekStart.getMonth() ? "" : short(end) + " "}${end.getDate()}`;
  const total = Array.from({ length: 7 }, (_, i) => (tasks[keyOf(addDays(weekStart, i))] || []).length)
    .reduce((a, b) => a + b, 0);
  $("subtitle").textContent = `${end.getFullYear()} · ${total} thing${total === 1 ? "" : "s"} this week`;

  weekEl.innerHTML = "";
  const today = new Date();
  let todayCol = null;

  for (let i = 0; i < 7; i++){
    const d = addDays(weekStart, i);
    const list = tasks[keyOf(d)] || [];
    const left = list.filter(t => !t.done).length;

    const col = document.createElement("article");
    col.className = "wk-day gloss";
    if (sameDay(d, today)){ col.classList.add("today"); todayCol = col; }

    col.innerHTML = `
      <div class="wk-head">
        <span class="wk-num">${d.getDate()}</span>
        <div>
          <div class="wk-name">${WEEKDAYS[d.getDay()]}</div>
          <div class="wk-count">${list.length ? `${left} of ${list.length} left` : short(d)}</div>
        </div>
      </div>`;

    const ul = document.createElement("ul");
    ul.className = "wk-list";
    if (!list.length){
      ul.innerHTML = `<li class="wk-empty">Free day</li>`;
    } else {
      list.forEach(t => ul.appendChild(taskRow(d, t)));
    }
    col.appendChild(ul);

    const add = document.createElement("button");
    add.className = "bubble-btn wk-add";
    add.textContent = "+ Add";
    add.setAttribute("aria-label", `Add to ${WEEKDAYS[d.getDay()]}`);
    add.addEventListener("click", () => openDay(d));
    col.appendChild(add);

    weekEl.appendChild(col);
  }
  animate(weekEl, dir);
  if (todayCol && dir !== undefined) todayCol.scrollIntoView({ inline: "start", block: "nearest" });
}

/* one task row with check + delete — used in week view and the drawer */
function taskRow(day, t){
  const li = document.createElement("li");
  li.className = "task" + (t.done ? " done" : "");
  li.style.setProperty("--c", t.color);

  const check = document.createElement("button");
  check.className = "check";
  check.setAttribute("aria-label", t.done ? `Mark ${t.text} not done` : `Mark ${t.text} done`);
  check.addEventListener("click", () => { t.done = !t.done; save(); refresh(); });

  const text = document.createElement("span");
  text.className = "task-text";
  text.textContent = t.text;

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "×";
  del.setAttribute("aria-label", `Delete ${t.text}`);
  del.addEventListener("click", () => {
    const k = keyOf(day);
    tasks[k] = tasks[k].filter(x => x.id !== t.id);
    if (!tasks[k].length) delete tasks[k];
    save(); refresh();
  });

  li.append(check, text, del);
  return li;
}

function refresh(){
  render();
  if (selected) renderDrawer();
}

/* =========================================================
   13. NAVIGATION
   ========================================================= */
function step(dir){
  if (mode === "month") monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() + dir, 1);
  else weekStart = addDays(weekStart, 7 * dir);
  render(dir);
}
function goToday(){
  const now = new Date();
  const target = mode === "month" ? firstOfMonth(now) : startOfWeek(now);
  const current = mode === "month" ? monthStart : weekStart;
  const dir = target < current ? -1 : target > current ? 1 : 0;
  monthStart = firstOfMonth(now);
  weekStart = startOfWeek(now);
  render(dir);
}
function setMode(m){
  mode = m;
  store(VIEW_KEY, m);
  // keep both views pointed at the same place
  if (m === "week"){
    const now = new Date();
    weekStart = firstOfMonth(now).getTime() === monthStart.getTime()
      ? startOfWeek(now) : startOfWeek(monthStart);
  } else {
    monthStart = firstOfMonth(addDays(weekStart, 3));
  }
  render(0);
}

/* =========================================================
   14. DRAWER
   ========================================================= */
function openDay(d){
  selected = d;
  if (mode === "month" && (d.getMonth() !== monthStart.getMonth() || d.getFullYear() !== monthStart.getFullYear())){
    const dir = d < monthStart ? -1 : 1;
    monthStart = firstOfMonth(d);
    render(dir);
  } else {
    render();
  }
  $("weekdayName").textContent = WEEKDAYS[d.getDay()];
  $("dateName").textContent = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  renderDrawer();
  drawer.classList.add("open");
  scrim.classList.add("show");
  setTimeout(() => $("taskInput").focus(), 250);
}
function closeDay(){
  drawer.classList.remove("open");
  scrim.classList.remove("show");
  selected = null;
  render();
}
function renderDrawer(){
  const list = tasks[keyOf(selected)] || [];
  const ul = $("taskList");
  ul.innerHTML = "";
  if (!list.length){
    ul.innerHTML = `<li class="empty">
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>
      Nothing planned yet. Add a task below.</li>`;
    return;
  }
  list.forEach(t => ul.appendChild(taskRow(selected, t)));
}
function addTask(text){
  const k = keyOf(selected);
  (tasks[k] ||= []).push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    text, color: chosenColor, done: false,
  });
  save(); refresh();
}

/* color picker */
function renderSwatches(){
  const wrap = $("swatches");
  COLORS.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch";
    b.dataset.hex = c.hex;
    b.style.setProperty("--c", c.hex);
    b.setAttribute("aria-label", c.name);
    b.setAttribute("aria-pressed", c.hex === chosenColor);
    b.addEventListener("click", () => pickColor(c.hex));
    wrap.appendChild(b);
  });
  const custom = document.createElement("input");
  custom.type = "color";
  custom.className = "custom-color";
  custom.value = "#ff8fb8";
  custom.setAttribute("aria-label", "Custom color");
  custom.addEventListener("input", e => pickColor(e.target.value));
  wrap.appendChild(custom);
}
function pickColor(hex){
  chosenColor = hex;
  document.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", s.dataset.hex === hex));
}

/* =========================================================
   15. EVENTS
   ========================================================= */
$("prevBtn").addEventListener("click", () => step(-1));
$("nextBtn").addEventListener("click", () => step(1));
$("todayBtn").addEventListener("click", goToday);
$("tabMonth").addEventListener("click", () => setMode("month"));
$("tabWeek").addEventListener("click", () => setMode("week"));
$("closeBtn").addEventListener("click", closeDay);
scrim.addEventListener("click", closeDay);
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("open")) closeDay(); });

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("taskInput");
  const text = input.value.trim();
  if (!text) return;
  addTask(text);
  input.value = "";
  input.focus();
});

/* swipe the month grid to change months (week view scrolls sideways instead) */
let touchX = null;
grid.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
grid.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  touchX = null;
});

renderSwatches();
if (mode !== "month" && mode !== "week") mode = "month";
render(0);
</script>
</body>
</html>
